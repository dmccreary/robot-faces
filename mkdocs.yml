    - 11. Expression Design, Readability & Human-Robot Interaction: chapters/11-expression-design-readability-hri/index.md
    - "12. Animating Expressions: Timing & Motion": chapters/12-animating-expressions/index.md
    - "13. Interactive Controls: Inputs & Concurrency": chapters/13-interactive-controls-inputs/index.md
    - 14. Building an Expression Menu & Live Controls: chapters/14-expression-menu-live-controls/index.md
    - 15. Porting Faces to a Color Display: chapters/15-porting-faces-color-display/index.md
    - 16. Computational Thinking & Capstone Design: chapters/16-computational-thinking-capstone/index.md
